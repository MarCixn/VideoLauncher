; PlatformIO Project Configuration File
; STM32F103C8T6 (Blue Pill) ARGB Controller
; USB HID device for Android control

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; USB HID support
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USB_MANUFACTURER="VideoLauncher"
    -D USB_PRODUCT="ARGB Controller"
    -D HAL_PCD_MODULE_ENABLED

; Upload via ST-Link or Serial
upload_protocol = stlink
; Alternative: upload_protocol = serial

lib_deps =
    fastled/FastLED@^3.6.0

monitor_speed = 115200
