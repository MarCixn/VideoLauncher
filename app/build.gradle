apply plugin: 'com.android.application'

android {
    namespace 'com.marcixn.videolauncher'
    compileSdk 28

    defaultConfig {
        applicationId "com.marcixn.videolauncher"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
